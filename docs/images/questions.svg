<text x="52" y="168" font-size="11" fill="#1B4F9C" text-anchor="start" font-weight="600">PROCESS CHANGE   Version 1</text>
<text x="52" y="200" font-size="20" fill="#1A2230" text-anchor="start" font-weight="600">Password reset calls now require</text>
<text x="52" y="226" font-size="20" fill="#1A2230" text-anchor="start" font-weight="600">a manager callback</text>
<text x="52" y="268" font-size="14" fill="#1A2230" text-anchor="start">Starting Monday, do not reset a password on the</text>
<text x="52" y="290" font-size="14" fill="#1A2230" text-anchor="start">caller&#x27;s word alone. Call the user&#x27;s manager back at</text>
<text x="52" y="312" font-size="14" fill="#1A2230" text-anchor="start">the number in the directory and confirm before you</text>
<text x="52" y="334" font-size="14" fill="#1A2230" text-anchor="start">reset. Log the manager&#x27;s name in the ticket.</text>
